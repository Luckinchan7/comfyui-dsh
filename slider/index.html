<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denoise 滑杆 · Illustrious-XL</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#141821; --panel2:#1b2130; --line:#262e3d;
    --fg:#e6ebf5; --dim:#8894ab; --accent:#5b9cff; --accent2:#7c5bff;
    --ok:#43d19e; --warn:#ffb648; --err:#ff5d6c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 20% -10%, #17203a 0%, #0b0d12 55%);
    color:var(--fg);
    font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; justify-content:center; padding:20px;
  }
  .app{width:100%; max-width:1080px; display:grid; grid-template-columns:320px 1fr; gap:18px; align-items:start}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px}
  .card h2{margin:0 0 12px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); font-weight:600}

  .status{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); margin-bottom:14px}
  .dot{width:8px;height:8px;border-radius:50%;background:#444; flex:0 0 auto}
  .dot.on{background:var(--ok); box-shadow:0 0 8px var(--ok)}
  .dot.off{background:var(--err); box-shadow:0 0 8px var(--err)}

  label.f{display:block; font-size:12px; color:var(--dim); margin:12px 0 5px}
  textarea, input[type=text], input[type=number], select{
    width:100%; background:#0e1219; color:var(--fg);
    border:1px solid var(--line); border-radius:9px; padding:8px 10px;
    font:inherit; outline:none; transition:border-color .15s;
  }
  textarea{resize:vertical; min-height:64px; line-height:1.5}
  textarea:focus, input:focus, select:focus{border-color:var(--accent)}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}

  .warn{
    margin:10px 0 4px; padding:10px 12px; border-radius:10px; font-size:12px; line-height:1.6;
    background:rgba(255,182,72,.10); border:1px solid rgba(255,182,72,.38); color:#ffd79a;
  }
  .warn b{color:#ffc36b}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px}
  .chip{
    background:#0e1219; color:var(--dim); border:1px solid var(--line); border-radius:999px;
    padding:4px 10px; font-size:11px; cursor:pointer; transition:.15s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent)}
  .chip:active{transform:scale(.96)}

  .denoise-box{margin:6px 0 2px; padding:14px; border-radius:12px; background:#0e1219; border:1px solid var(--line)}
  .denoise-val{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px}
  .denoise-val b{font-size:30px; font-variant-numeric:tabular-nums; letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .denoise-val span{font-size:11px; color:var(--dim)}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:26px; background:transparent; cursor:pointer; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:8px; border-radius:99px;
    background:linear-gradient(90deg,#3ddc97 0%,#5b9cff 45%,#7c5bff 70%,#ff5d6c 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px;height:20px;border-radius:50%;
    background:#fff; border:3px solid #0b0d12; margin-top:-6px;
    box-shadow:0 0 0 1px #ffffff55, 0 2px 8px #000a;
  }
  .ticks{display:flex; justify-content:space-between; font-size:10px; color:#5b6577; margin-top:2px}
  .hint{font-size:11.5px; color:var(--dim); margin-top:8px; line-height:1.5; border-left:2px solid var(--accent); padding-left:9px}

  button{
    font:inherit; border-radius:9px; border:1px solid var(--line); cursor:pointer;
    background:var(--panel2); color:var(--fg); padding:9px 14px; transition:.15s;
  }
  button:hover{border-color:#3a465c}
  button:disabled{opacity:.45; cursor:not-allowed}
  .primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#fff; font-weight:600; width:100%; padding:12px}
  .primary:disabled{filter:grayscale(.6)}

  .stage{display:flex; flex-direction:column; gap:18px}
  .compare{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .pane{background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column}
  .pane header{padding:9px 12px; font-size:11.5px; color:var(--dim); letter-spacing:.05em;
    border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; text-transform:uppercase}
  .pane header .tag{background:#0e1219; border:1px solid var(--line); border-radius:6px; padding:1px 7px; font-variant-numeric:tabular-nums; color:var(--accent)}
  .pane .imgwrap{position:relative; background:#080a0e; min-height:180px; display:flex; align-items:center; justify-content:center}
  .pane img{max-width:100%; display:block}
  .pane .empty{color:#4a5364; font-size:12px; padding:40px 0}

  .drop{border:1.5px dashed var(--line); border-radius:12px; padding:22px; text-align:center; cursor:pointer; transition:.15s; color:var(--dim); font-size:12.5px}
  .drop:hover,.drop.over{border-color:var(--accent); color:var(--fg); background:#0e1219}
  .drop img{max-height:96px; border-radius:8px}

  .prog{height:4px; border-radius:99px; background:#0e1219; overflow:hidden; display:none}
  .prog.on{display:block}
  .prog i{display:block; height:100%; width:30%; border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); animation:sweep 1.15s linear infinite}
  @keyframes sweep{0%{margin-left:-32%}100%{margin-left:102%}}

  .log{font-family:Consolas,monospace; font-size:11.5px; color:var(--dim); max-height:96px; overflow:auto; white-space:pre-wrap}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .compare{grid-template-columns:1fr}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ============ 左：控制 ============ -->
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="card">
      <h2>ComfyUI</h2>
      <div class="status"><i class="dot" id="dot"></i><span id="statusText">检测中…</span></div>

      <div class="card" style="background:#0e1219;border-radius:10px;padding:12px;margin-bottom:4px">
        <h2 style="margin-bottom:8px">Denoise 强度</h2>
        <div class="denoise-box">
          <div class="denoise-val"><b id="dnVal">0.55</b><span id="dnTag">中幅改动</span></div>
          <input type="range" id="dn" min="0.05" max="1" step="0.01" value="0.55">
          <div class="ticks"><span>0.05</span><span>0.5</span><span>1.0</span></div>
        </div>
        <div class="hint" id="dnHint"></div>
      </div>
    </div>

    <div class="card">
      <h2>源图</h2>
      <div class="drop" id="drop">
        <input type="file" id="file" accept="image/*" hidden>
        <div id="dropInner">点击或拖入图片<br><span style="font-size:11px">同一张图反复试不同 denoise</span></div>
      </div>
      <button id="modeCreate" style="width:100%;margin-top:10px">换成纯文生图（不用源图）</button>
    </div>

    <div class="card">
      <h2>参数</h2>
      <div class="warn" id="langWarn">
        <b>提示词用英文效果明显更好。</b>SDXL 的文本编码器是按英文标签训练的，中文写进去基本等于噪声 —— 同一张图、同一个 seed、同样 denoise，英文能改到位，中文常常纹丝不动。
      </div>
      <label class="f">正向提示词（英文标签式最准）</label>
      <textarea id="prompt" spellcheck="false" style="min-height:88px">best quality, masterpiece, amazing quality, very aesthetic, absurdres, 1girl, solo, detailed face, beautiful detailed eyes, silver hair, long hair, looking at viewer</textarea>
      <div class="chips">
        <button type="button" class="chip" data-tag="best quality, masterpiece, amazing quality, very aesthetic, absurdres">质量词</button>
        <button type="button" class="chip" data-tag="detailed face, beautiful detailed eyes, sharp focus">精细脸</button>
        <button type="button" class="chip" data-tag="1girl, solo">单人</button>
        <button type="button" class="chip" data-tag="silver hair, long hair, blue eyes">银发蓝眼</button>
        <button type="button" class="chip" data-tag="same pose, same art style, same girl, identical face">锁身份</button>
        <button type="button" class="chip" data-tag="full body, standing, from side">全身侧身</button>
      </div>
      <label class="f">负向提示词</label>
      <textarea id="negative" spellcheck="false" style="min-height:52px"></textarea>
      <div class="row">
        <div><label class="f">步数</label><input type="number" id="steps" value="24" min="1" max="80"></div>
        <div><label class="f">CFG</label><input type="number" id="cfg" value="6.5" min="0.5" max="20" step="0.5"></div>
      </div>
      <div class="row">
        <div><label class="f">采样器</label><select id="sampler"></select></div>
        <div><label class="f">调度器</label><select id="scheduler"></select></div>
      </div>
      <div class="row">
        <div><label class="f">Seed（-1 随机）</label><input type="number" id="seed" value="-1"></div>
        <div><label class="f">尺寸</label>
          <select id="size">
            <option value="1024x1024">1024 × 1024</option>
            <option value="832x1216">832 × 1216 竖</option>
            <option value="1216x832">1216 × 832 横</option>
            <option value="896x1152">896 × 1152 竖</option>
            <option value="1152x896">1152 × 896 横</option>
          </select>
        </div>
      </div>
      <button class="primary" id="go" style="margin-top:16px">生成（约 45–70 秒）</button>
      <div class="prog" id="prog" style="margin-top:12px"><i></i></div>
    </div>
  </div>

  <!-- ============ 右：结果 ============ -->
  <div class="stage">
    <div class="compare">
      <div class="pane">
        <header><span>源图</span><span class="tag" id="srcTag">—</span></header>
        <div class="imgwrap"><div class="empty" id="srcEmpty">未选择</div><img id="srcImg" hidden></div>
      </div>
      <div class="pane">
        <header><span>结果</span><span class="tag" id="outTag">—</span></header>
        <div class="imgwrap"><div class="empty" id="outEmpty">等待生成</div><img id="outImg" hidden></div>
      </div>
    </div>

    <div class="card">
      <h2>历史（点一下载入参数）</h2>
      <div id="hist" class="log">（空）</div>
    </div>

    <div class="card">
      <h2>运行日志</h2>
      <div id="log" class="log">就绪</div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const state = { mode: "edit", sourceImage: null, sourceName: "", busy: false, timer: null };

const DENOISE_GUIDE = [
  [0.00, 0.20, "微调", "只改噪点与细节，其余几乎不动"],
  [0.20, 0.40, "轻改", "可换发色/光照，结构基本不变"],
  [0.40, 0.55, "保守", "身份最稳，改动幅度小（0.55 是默认档）"],
  [0.55, 0.75, "中幅", "明显改动，脸型开始轻微漂移"],
  [0.75, 0.88, "大幅", "大范围重绘，脸还能认出（0.8 在这一档）"],
  [0.88, 0.97, "激进", "只借构图，脸和细节都会重画"],
  [0.97, 1.01, "等于重画", "参考图几乎不起作用"],
];

function guide(v) {
  for (const [lo, hi, tag, text] of DENOISE_GUIDE) if (v >= lo && v < hi) return { tag, text };
  return { tag: "等于重画", text: "参考图几乎不起作用" };
}

function logLine(s) {
  const el = $("log");
  el.textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false }) + "  " + s + "\n" + el.textContent;
}

function syncDenoise() {
  const v = Number($("dn").value);
  $("dnVal").textContent = v.toFixed(2);
  const g = guide(v);
  $("dnTag").textContent = g.tag;
  $("dnHint").textContent = g.text;
}
$("dn").addEventListener("input", syncDenoise);

$("negative").value = "lowres, bad anatomy, bad hands, extra digits, fewer digits, missing fingers, watermark, text, signature, username, jpeg artifacts, worst quality, low quality, normal quality, monochrome, grayscale";

/* ---------- 健康检查 ---------- */
async function health() {
  try {
    const r = await fetch("/api/health");
    const d = await r.json();
    const dot = $("dot");
    if (d.comfyui) {
      dot.className = "dot on";
      const freeGb = (d.vramFree / 1073741824).toFixed(1);
      const totGb = (d.vramTotal / 1073741824).toFixed(1);
      $("statusText").textContent = `ComfyUI ${d.version} · 显存 ${freeGb}/${totGb} GB · 队列 ${d.queue.running}/${d.queue.pending}`;
      fillOptions();
      return true;
    }
    dot.className = "dot off";
    $("statusText").textContent = "ComfyUI 未运行 · 先双击桌面「启动ComfyUI.bat」";
    return false;
  } catch (e) {
    $("dot").className = "dot off";
    $("statusText").textContent = "滑杆服务异常";
    return false;
  }
}

let optionsLoaded = false;

async function fillOptions() {
  if (optionsLoaded) return;
  try {
    const r = await fetch("/api/samplers");
    const d = await r.json();
    const s = $("sampler"), sc = $("scheduler");
    s.innerHTML = ""; sc.innerHTML = "";
    (d.samplers || []).forEach((x) => {
      const o = document.createElement("option"); o.value = x; o.textContent = x;
      if (x === "dpmpp_2m") o.selected = true; s.appendChild(o);
    });
    (d.schedulers || []).forEach((x) => {
      const o = document.createElement("option"); o.value = x; o.textContent = x;
      if (x === "karras") o.selected = true; sc.appendChild(o);
    });
    healthData.samplersLoaded = true;
    optionsLoaded = true;
  } catch (e) { /* keep manual */ }
}

/* ---------- 源图 ---------- */
$("drop").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => { if (e.target.files[0]) loadFile(e.target.files[0]); });
["dragover", "dragenter"].forEach((ev) =>
  $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((ev) =>
  $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => {
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith("image/")) loadFile(f);
});

function readAsDataUrl(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

async function loadFile(file) {
  if (state.busy) return logLine("生成中，等这一张结束再换源图");
  logLine("上传 " + file.name + " (" + Math.round(file.size / 1024) + " KB)");
  const dataUrl = await readAsDataUrl(file);
  $("srcImg").src = dataUrl; $("srcImg").hidden = false; $("srcEmpty").hidden = true;
  $("srcTag").textContent = "上传中…";
  try {
    const r = await fetch("/api/upload", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ dataUrl }),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    state.sourceImage = d.image;
    state.sourceName = file.name;
    state.mode = "edit";
    $("srcTag").textContent = Math.round(d.bytes / 1024) + " KB";
    syncModeButton();
    $("dn").disabled = false;
    logLine("已就位 " + d.image + " · 可以拖滑杆反复试");
  } catch (e) {
    $("srcTag").textContent = "失败";
    logLine("上传失败: " + e.message);
  }
}

function syncModeButton() {
  const b = $("modeCreate");
  if (!state.sourceImage) {
    b.textContent = "现在还没有源图 · 点上方框选一张";
    b.disabled = true;
    b.style.opacity = ".55";
    b.style.cursor = "not-allowed";
    return;
  }
  b.disabled = false;
  b.style.opacity = "";
  b.style.cursor = "";
  b.textContent = state.mode === "edit"
    ? "换成纯文生图（不用源图）"
    : "切回图生图（用刚才的源图）";
}

$("modeCreate").addEventListener("click", () => {
  if (state.busy) return logLine("生成中，等这一张结束再切模式");
  if (!state.sourceImage) return logLine("先选一张源图");
  state.mode = state.mode === "edit" ? "create" : "edit";
  syncModeButton();
  $("dn").disabled = state.mode === "create";
  logLine(state.mode === "edit"
    ? "切回图生图：滑杆生效"
    : "切到纯文生图：滑杆不起作用（denoise 固定 1.0）");
});

/* ---------- 生成 ---------- */
$("go").addEventListener("click", async () => {
  if (state.busy) return;
  const [w, h] = $("size").value.split("x").map(Number);
  const payload = {
    mode: state.mode,
    prompt: $("prompt").value,
    negative: $("negative").value,
    denoise: Number($("dn").value),
    steps: Number($("steps").value),
    cfg: Number($("cfg").value),
    sampler: $("sampler").value || "dpmpp_2m",
    scheduler: $("scheduler").value || "karras",
    seed: Number($("seed").value),
    sourceImage: state.sourceImage,
    width: w, height: h,
  };
  if (payload.mode === "edit" && !payload.sourceImage) {
    return logLine("先选一张源图");
  }
  state.busy = true;
  $("go").disabled = true;
  $("prog").classList.add("on");
  $("outTag").textContent = "生成中…";
  logLine(`提交 mode=${payload.mode} denoise=${payload.denoise} seed=${payload.seed}`);

  try {
    const r = await fetch("/api/edit", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error + (d.detail ? " " + JSON.stringify(d.detail).slice(0, 200) : ""));
    poll(d.id);
  } catch (e) {
    finish();
    $("outTag").textContent = "失败";
    logLine("提交失败: " + e.message);
  }
});

function poll(id) {
  let ticks = 0;
  state.timer = setInterval(async () => {
    ticks++;
    try {
      const r = await fetch("/api/job?id=" + encodeURIComponent(id));
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      if (j.state === "done") {
        clearInterval(state.timer);
        const f = j.files[0];
        const q = new URLSearchParams({ filename: f.filename, subfolder: f.subfolder, type: f.type });
        $("outImg").src = "/api/view?" + q.toString();
        $("outImg").hidden = false;
        $("outEmpty").hidden = true;
        const p = j.params;
        $("outTag").textContent = `denoise ${p.denoise.toFixed(2)} · ${(j.elapsedMs / 1000).toFixed(1)}s`;
        logLine(`完成 ${(j.elapsedMs / 1000).toFixed(1)}s → ${f.filename}`);
        finish();
        loadHistory();
      } else if (j.state === "error") {
        clearInterval(state.timer);
        finish();
        $("outTag").textContent = "出错";
        logLine("执行出错: " + j.error);
      } else if (ticks % 15 === 0) {
        $("outTag").textContent = j.state === "running" ? "采样中…" : "排队中…";
      }
    } catch (e) {
      clearInterval(state.timer);
      finish();
      logLine("轮询失败: " + e.message);
    }
  }, 1000);
}

function finish() {
  state.busy = false;
  $("go").disabled = false;
  $("prog").classList.remove("on");
}

/* ---------- 历史 ---------- */
async function loadHistory() {
  try {
    const r = await fetch("/api/history");
    const d = await r.json();
    const el = $("hist");
    if (!d.items.length) { el.textContent = "（空）"; return; }
    el.innerHTML = d.items.map((it, i) => {
      const q = new URLSearchParams({ filename: it.file, subfolder: it.subfolder || "", type: "output" });
      return `<div style="display:flex;gap:9px;align-items:center;padding:5px 0;border-bottom:1px solid #1e2531">
        <img src="/api/view?${q}" style="width:44px;height:44px;object-fit:cover;border-radius:6px;cursor:pointer" data-i="${i}">
        <div style="flex:1;font-size:11.5px;line-height:1.4">
          <div style="color:#5b9cff;font-weight:600">denoise ${it.params.denoise.toFixed(2)} <span style="color:#8894ab;font-weight:400">· ${(it.elapsedMs/1000).toFixed(0)}s · seed ${it.params.seed}</span></div>
          <div style="color:#5b6577;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px">${escapeHtml(it.params.prompt).slice(0,80)}</div>
        </div>
      </div>`;
    }).join("");
    el.querySelectorAll("img[data-i]").forEach((im) => {
      im.addEventListener("click", () => {
        const it = d.items[Number(im.dataset.i)];
        $("dn").value = it.params.denoise;
        $("prompt").value = it.params.prompt;
        $("negative").value = it.params.negative;
        $("steps").value = it.params.steps;
        $("cfg").value = it.params.cfg;
        $("seed").value = it.params.seed;
        syncDenoise();
        const q = new URLSearchParams({ filename: it.file, subfolder: it.subfolder || "", type: "output" });
        $("outImg").src = "/api/view?" + q; $("outImg").hidden = false; $("outEmpty").hidden = true;
        $("outTag").textContent = "denoise " + it.params.denoise.toFixed(2);
        logLine("载入历史参数 denoise=" + it.params.denoise);
      });
    });
  } catch (e) { /* ignore */ }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- 启动 ---------- */
syncDenoise();
syncModeButton();
health();
setInterval(health, 8000);
loadHistory();

/* 中文/标签式快捷插入：点一下追加到正向提示词末尾，不覆盖已写的 */
document.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const tag = chip.dataset.tag || "";
  const box = $("prompt");
  const cur = box.value.trim();
  if (!cur) box.value = tag;
  else if (!cur.includes(tag)) box.value = cur.replace(/[,\s]+$/, "") + ", " + tag;
  box.focus();
  box.selectionStart = box.selectionEnd = box.value.length;
  logLine("已追加标签：" + tag.slice(0, 48));
});
</script>
